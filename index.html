<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:   #1a73e8;
  --blue-l: #e8f0fe;
  --green:  #188038;
  --green-l:#e6f4ea;
  --yellow: #f29900;
  --yellow-l:#fef7e0;
  --red:    #d93025;
  --red-l:  #fce8e6;
  --gray:   #5f6368;
  --gray-l: #f1f3f4;
  --border: #dadce0;
  --text:   #202124;
  --muted:  #5f6368;
  --bg:     #f8f9fa;
  --white:  #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-h:0 4px 14px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
  --r: 8px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

/* ── TOP HEADER ── */
header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex; align-items: center; gap: 24px;
  height: 60px; position: sticky; top: 0; z-index: 300;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-letters { font-size: 20px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
.logo-sub { font-size: 12px; color: var(--muted); }

.search-wrap { position: relative; flex: 1; max-width: 480px; }
.search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-wrap input {
  width: 100%; border: 1px solid var(--border); border-radius: 22px;
  padding: 8px 14px 8px 38px; font-size: 13px; color: var(--text);
  background: var(--gray-l); outline: none; font-family: inherit;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.search-wrap input::placeholder { color: #9aa0a6; }
.search-wrap input:focus { border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 3px rgba(26,115,232,.12); }

.mode-toggle { margin-left: auto; display: flex; background: var(--gray-l); border-radius: 22px; padding: 3px; gap: 2px; flex-shrink: 0; }
.mode-btn { padding: 6px 18px; border-radius: 18px; border: none; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
.mode-btn.active { background: var(--white); color: var(--blue); box-shadow: 0 1px 4px rgba(0,0,0,.1); font-weight: 600; }
.mode-badge { background: var(--gray-l); color: var(--muted); border-radius: 10px; padding: 1px 6px; font-size: 10px; margin-left: 3px; }
.mode-btn.active .mode-badge { background: var(--blue-l); color: var(--blue); }

.logout-link { font-size: 12px; color: var(--muted); cursor: pointer; margin-left: 14px; flex-shrink: 0; }
.logout-link:hover { color: var(--blue); }

/* ── SECTION CONTROLS ── */
.section-controls {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 32px; display: flex; overflow-x: auto; scrollbar-width: none;
}
.section-controls::-webkit-scrollbar { display: none; }
.tab { padding: 13px 18px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; display: flex; align-items: center; gap: 6px; transition: color .15s; }
.tab:hover { color: var(--blue); background: var(--blue-l); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* chip row */
.chip-row { padding: 10px 32px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg); }
.chip-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-right: 4px; }
.chip { padding: 4px 13px; border-radius: 14px; border: 1px solid var(--border); background: var(--white); font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; font-family: inherit; transition: all .15s; }
.chip:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-l); }
.chip.active { border-color: var(--blue); background: var(--blue-l); color: var(--blue); font-weight: 600; }

.results-bar { padding: 9px 32px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.batch-btns { display: flex; gap: 6px; }
.refresh-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 13px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--white);
  font-size: 12px; font-weight: 600; color: var(--muted);
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.refresh-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-l); }
.refresh-btn.primary { border-color: var(--blue); color: var(--blue); }
.refresh-btn.primary:hover { background: var(--blue-l); }
.refresh-btn:disabled { opacity: .5; cursor: default; }

/* ── GRID ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 16px; padding: 20px 32px 48px; }

/* ── FORUM CARD ── */
.card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .2s, transform .15s; }
.card:hover { box-shadow: var(--shadow-h); transform: translateY(-1px); }
.card-stripe { height: 4px; }
.stripe-blue   { background: var(--blue); }
.stripe-green  { background: var(--green); }
.stripe-yellow { background: var(--yellow); }
.stripe-red    { background: var(--red); }
.stripe-gray   { background: #bdc1c6; }

.card-body { padding: 16px; display: flex; flex-direction: column; gap: 11px; flex: 1; }
.card-top { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.plat-pill { padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; flex-shrink: 0; background: var(--blue-l); color: #0055a5; }

/* post box */
.post-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.post-box-head { background: var(--gray-l); padding: 7px 11px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.post-box-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.copy-btn { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--white); font-size: 11px; font-weight: 600; color: var(--blue); cursor: pointer; font-family: inherit; transition: all .15s; }
.copy-btn:hover { background: var(--blue-l); border-color: var(--blue); }
.copy-btn.copied { color: var(--green); border-color: var(--green); background: var(--green-l); }
.post-box-body { padding: 11px 12px; font-size: 12.5px; color: #3c4043; line-height: 1.65; white-space: pre-wrap; font-family: inherit; }

/* ── NEWSLETTER CARDS ── */
.nl-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .2s, transform .15s; }
.nl-card:hover { box-shadow: var(--shadow-h); transform: translateY(-1px); }
.nl-card-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.nl-meta { flex: 1; }
.nl-topic { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; background: var(--blue-l); color: var(--blue); }
.nl-headline { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; }
.nl-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.nl-post-box { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.nl-post-head { background: var(--gray-l); padding: 7px 11px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.nl-post-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.nl-post-body { padding: 12px; font-size: 12.5px; color: #3c4043; line-height: 1.65; white-space: pre-wrap; font-family: inherit; }

.empty { grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--muted); }
.empty h3 { font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.empty p { font-size: 13px; color: #9aa0a6; }

/* save / trash / publish action row */
.card-actions { display: flex; gap: 6px; margin-top: 2px; }
.action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--white); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; color: var(--muted); }
.save-btn:hover { border-color: #188038; color: #188038; background: var(--green-l); }
.trash-btn:hover { border-color: #d93025; color: #d93025; background: var(--red-l); }
.publish-btn:hover { border-color: #1a73e8; color: #1a73e8; background: var(--blue-l); }
.unpublish-btn:hover { border-color: var(--yellow); color: #a06000; background: var(--yellow-l); }

.hidden { display: none !important; }

/* ── AUTH / ONBOARDING ── */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-box { background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 36px; width: 100%; max-width: 400px; }
.auth-box.wide { max-width: 540px; }
.auth-box h2 { font-size: 20px; margin-bottom: 4px; }
.auth-box .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin: 14px 0 5px; }
.field-label:first-of-type { margin-top: 0; }
input[type=text], input[type=email], input[type=password], textarea, select {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 12px; font-size: 13px; color: var(--text);
  background: var(--white); outline: none; font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
textarea { resize: vertical; min-height: 60px; }
.btn-primary {
  width: 100%; padding: 10px 0; border-radius: 8px; border: none;
  background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit; margin-top: 18px; transition: background .15s;
}
.btn-primary:hover { background: #1558c0; }
.btn-primary:disabled { opacity: .5; cursor: default; }
.error-text { color: var(--red); font-size: 12.5px; margin-top: 8px; }
.switch-link { text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--blue); cursor: pointer; }
.switch-link:hover { text-decoration: underline; }
.checkbox-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.checkbox-grid label {
  display: flex; align-items: center; gap: 6px; font-size: 12.5px;
  border: 1px solid var(--border); border-radius: 14px; padding: 5px 12px; cursor: pointer;
  transition: all .15s;
}
.checkbox-grid input { width: auto; }
.checkbox-grid label:has(input:checked) { border-color: var(--blue); background: var(--blue-l); color: var(--blue); font-weight: 600; }

@media (max-width: 640px) {
  header { padding: 0 14px; gap: 10px; }
  .section-controls, .chip-row, .results-bar, .grid { padding-left: 14px; padding-right: 14px; }
  .grid { grid-template-columns: 1fr; }
  .logo-sub { display: none; }
  .mode-btn { padding: 5px 11px; font-size: 12px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://ynktfetpbpyxjvzyuwsj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlua3RmZXRwYnB5eGp2enl1d3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDg2NTksImV4cCI6MjA5NzE4NDY1OX0.yF2tYVWCuSaG3NKbLPc20NxXt59lk0Hl7_wOCm5HxGE';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DEFAULT_PLATFORMS = ['Reddit', 'LinkedIn', 'Quora', 'X / Twitter', 'Hacker News', 'Facebook Groups'];
const STRIPES = ['stripe-blue', 'stripe-green', 'stripe-yellow', 'stripe-red', 'stripe-gray'];

let session = null;
let profile = null;
let saves = [];
let activeMode = 'forums';   // 'forums' | 'newsletter' | 'saved' | 'published'
let activeTopic = 'all';
let activePlatform = 'all';
let searchQuery = '';
let draft = null;
let generating = false;

const app = document.getElementById('app');

async function init() {
  const { data } = await supabase.auth.getSession();
  session = data.session;
  supabase.auth.onAuthStateChange((_event, newSession) => { session = newSession; boot(); });
  boot();
}

async function boot() {
  if (!session) return renderAuth();
  await loadProfile();
  if (!profile || !profile.onboarding_completed) return renderOnboarding();
  document.title = `${profile.brand_name} — Content Hub`;
  await loadSaves();
  activeTopic = 'all';
  activePlatform = 'all';
  renderHub();
}

// ---------- API helpers ----------

async function authedFetch(path, options = {}) {
  const token = session?.access_token;
  const res = await fetch(`/.netlify/functions/${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(options.headers || {}) }
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

async function loadProfile() { profile = await authedFetch('profile'); }
async function loadSaves() { saves = await authedFetch('saves'); }

function stripeFor(str) {
  let h = 0;
  for (const ch of (str || '')) h = (h * 31 + ch.charCodeAt(0)) % STRIPES.length;
  return STRIPES[h];
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---------- Auth view ----------

function renderAuth() {
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-box">
        <h2 id="auth-title">Log in</h2>
        <div class="sub">Content Hub</div>
        <label class="field-label">Email</label>
        <input id="email" type="email" autocomplete="email" />
        <label class="field-label">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <div id="auth-error" class="error-text hidden"></div>
        <button id="auth-submit" class="btn-primary">Log in</button>
        <div class="switch-link" id="auth-toggle">Don't have an account? Sign up</div>
      </div>
    </div>
  `;

  let mode = 'login';
  const title = document.getElementById('auth-title');
  const submit = document.getElementById('auth-submit');
  const toggle = document.getElementById('auth-toggle');
  const errBox = document.getElementById('auth-error');

  toggle.onclick = () => {
    mode = mode === 'login' ? 'signup' : 'login';
    title.textContent = mode === 'login' ? 'Log in' : 'Create an account';
    submit.textContent = mode === 'login' ? 'Log in' : 'Sign up';
    toggle.textContent = mode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Log in';
    errBox.classList.add('hidden');
  };

  submit.onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errBox.classList.add('hidden');
    submit.disabled = true;
    try {
      const fn = mode === 'login' ? 'signInWithPassword' : 'signUp';
      const { error } = await supabase.auth[fn]({ email, password });
      if (error) throw error;
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
    } finally {
      submit.disabled = false;
    }
  };
}

// ---------- Onboarding view ----------

function renderOnboarding() {
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-box wide">
        <h2>Tell us about your brand</h2>
        <div class="sub">This shapes every post Claude writes for you.</div>

        <label class="field-label">Brand name</label>
        <input id="brand_name" type="text" placeholder="e.g. Acme Analytics" />

        <label class="field-label">What does it do?</label>
        <textarea id="description" rows="3" placeholder="A short description of the product and what problem it solves"></textarea>

        <label class="field-label">Target audience</label>
        <textarea id="target_audience" rows="2" placeholder="Who are you trying to reach?"></textarea>

        <label class="field-label">Tone of voice</label>
        <input id="tone" type="text" placeholder="e.g. direct, technical, a little irreverent" />

        <label class="field-label">Topics you want posts about (comma separated)</label>
        <input id="topics" type="text" placeholder="e.g. pricing objections, product launch, common complaints" />

        <label class="field-label">Platforms</label>
        <div class="checkbox-grid" id="platform-checks">
          ${DEFAULT_PLATFORMS.map(p => `<label><input type="checkbox" value="${p}" /> ${p}</label>`).join('')}
        </div>

        <div id="onb-error" class="error-text hidden"></div>
        <button id="onb-submit" class="btn-primary">Finish setup</button>
      </div>
    </div>
  `;

  document.getElementById('onb-submit').onclick = async () => {
    const btn = document.getElementById('onb-submit');
    const errBox = document.getElementById('onb-error');
    const brand_name = document.getElementById('brand_name').value.trim();
    const description = document.getElementById('description').value.trim();
    const target_audience = document.getElementById('target_audience').value.trim();
    const tone = document.getElementById('tone').value.trim();
    const topics = document.getElementById('topics').value.split(',').map(t => t.trim()).filter(Boolean);
    const platforms = Array.from(document.querySelectorAll('#platform-checks input:checked')).map(el => el.value);

    if (!brand_name || !description) {
      errBox.textContent = 'Brand name and description are required.';
      errBox.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    try {
      await authedFetch('profile', {
        method: 'POST',
        body: JSON.stringify({ brand_name, description, target_audience, tone, topics, platforms })
      });
      await boot();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
      btn.disabled = false;
    }
  };
}

// ---------- Hub view ----------

function renderHub() {
  const savedCount = saves.filter(s => s.status === 'saved').length;
  const publishedCount = saves.filter(s => s.status === 'published').length;
  const letters = (profile.brand_name || 'Hub').split('').map(ch => `<span>${escapeHtml(ch)}</span>`).join('');

  app.innerHTML = `
    <header>
      <div class="logo">
        <div class="logo-letters">${letters}</div>
        <div class="logo-sub">Content Hub</div>
      </div>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search your posts…" value="${escapeHtml(searchQuery)}" />
      </div>
      <div class="mode-toggle">
        <button class="mode-btn ${activeMode === 'forums' ? 'active' : ''}" data-mode="forums">Forums</button>
        <button class="mode-btn ${activeMode === 'newsletter' ? 'active' : ''}" data-mode="newsletter">Newsletter</button>
        <button class="mode-btn ${activeMode === 'saved' ? 'active' : ''}" data-mode="saved">Saved${savedCount ? `<span class="mode-badge">${savedCount}</span>` : ''}</button>
        <button class="mode-btn ${activeMode === 'published' ? 'active' : ''}" data-mode="published">Published${publishedCount ? `<span class="mode-badge">${publishedCount}</span>` : ''}</button>
      </div>
      <span class="logout-link" id="logout-btn">Log out</span>
    </header>
    <div id="section-mount"></div>
  `;

  document.getElementById('search').oninput = (e) => { searchQuery = e.target.value; renderSection(); };
  document.getElementById('logout-btn').onclick = () => supabase.auth.signOut();
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => { activeMode = btn.dataset.mode; activeTopic = 'all'; activePlatform = 'all'; draft = null; renderHub(); };
  });

  renderSection();
}

function renderSection() {
  const mount = document.getElementById('section-mount');
  if (activeMode === 'forums' || activeMode === 'newsletter') {
    mount.innerHTML = renderGenerateSection(activeMode);
    wireGenerateSection(activeMode);
  } else {
    mount.innerHTML = renderListSection(activeMode);
    wireListSection();
  }
}

function renderGenerateSection(type) {
  const topics = profile.topics && profile.topics.length ? profile.topics : ['General'];
  const platforms = profile.platforms && profile.platforms.length ? profile.platforms : DEFAULT_PLATFORMS;

  const topicTabs = `
    <nav class="section-controls">
      <button class="tab ${activeTopic === 'all' ? 'active' : ''}" data-topic="all">All</button>
      ${topics.map(t => `<button class="tab ${activeTopic === t ? 'active' : ''}" data-topic="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
    </nav>
  `;

  const platformChips = type === 'forums' ? `
    <div class="chip-row">
      <span class="chip-label">Platform</span>
      <button class="chip ${activePlatform === 'all' ? 'active' : ''}" data-plat="all">All</button>
      ${platforms.map(p => `<button class="chip ${activePlatform === p ? 'active' : ''}" data-plat="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join('')}
    </div>
  ` : '';

  const canGenerate = activeTopic !== 'all' && (type === 'newsletter' || activePlatform !== 'all');
  const singularType = type === 'forums' ? 'forum' : 'newsletter';

  const currentDraft = (draft && draft.type === singularType) ? renderDraftCard(draft) : `
    <div class="empty">
      <h3>${canGenerate ? 'Ready to generate' : `Pick a topic${type === 'forums' ? ' and platform' : ''} above`}</h3>
      <p>${canGenerate ? 'Click Generate to write a post for this selection.' : 'Generate is enabled once a specific topic is chosen.'}</p>
    </div>
  `;

  return `
    ${topicTabs}
    ${platformChips}
    <div class="results-bar">
      <span>${type === 'forums' ? 'Forum post' : 'Newsletter issue'}</span>
      <div class="batch-btns">
        <button class="refresh-btn primary" id="gen-btn" ${!canGenerate || generating ? 'disabled' : ''}>
          ${generating ? 'Generating…' : 'Generate new'}
        </button>
      </div>
    </div>
    <div class="grid">${currentDraft}</div>
  `;
}

function wireGenerateSection(type) {
  document.querySelectorAll('[data-topic]').forEach(el => {
    el.onclick = () => { activeTopic = el.dataset.topic; draft = null; renderSection(); };
  });
  document.querySelectorAll('[data-plat]').forEach(el => {
    el.onclick = () => { activePlatform = el.dataset.plat; draft = null; renderSection(); };
  });
  const genBtn = document.getElementById('gen-btn');
  if (genBtn) genBtn.onclick = () => handleGenerate(type);
  wireDraftButtons();
  wireCopyButtons();
}

function renderDraftCard(d) {
  if (d.type === 'forum') {
    return `
      <div class="card" style="border-color: var(--blue);">
        <div class="card-stripe ${stripeFor(d.platform)}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="plat-pill">${escapeHtml(d.platform)}</span>
            <span style="font-size:11px;color:var(--muted);">New draft</span>
          </div>
          <div class="post-box">
            <div class="post-box-head">
              <span class="post-box-label">${escapeHtml(d.topic)}</span>
              <button class="copy-btn" data-copy>Copy</button>
            </div>
            <div class="post-box-body">${escapeHtml(d.content)}</div>
          </div>
          <div class="card-actions">
            <button class="action-btn save-btn" id="draft-save">Save</button>
            <button class="action-btn publish-btn" id="draft-publish">Publish</button>
            <button class="action-btn trash-btn" id="draft-discard">Discard</button>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="nl-card" style="border-color: var(--blue);">
      <div class="nl-card-head">
        <div class="nl-meta">
          <div class="nl-topic">${escapeHtml(d.topic)}</div>
          <div class="nl-headline">New draft</div>
        </div>
      </div>
      <div class="nl-body">
        <div class="nl-post-box">
          <div class="nl-post-head">
            <span class="nl-post-label">Issue</span>
            <button class="copy-btn" data-copy>Copy</button>
          </div>
          <div class="nl-post-body">${escapeHtml(d.content)}</div>
        </div>
        <div class="card-actions">
          <button class="action-btn save-btn" id="draft-save">Save</button>
          <button class="action-btn publish-btn" id="draft-publish">Publish</button>
          <button class="action-btn trash-btn" id="draft-discard">Discard</button>
        </div>
      </div>
    </div>
  `;
}

function wireDraftButtons() {
  const s = document.getElementById('draft-save');
  const p = document.getElementById('draft-publish');
  const d = document.getElementById('draft-discard');
  if (s) s.onclick = () => persistDraft('saved');
  if (p) p.onclick = () => persistDraft('published');
  if (d) d.onclick = () => { draft = null; renderSection(); };
}

function wireCopyButtons() {
  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.onclick = () => {
      const body = btn.closest('.card, .nl-card').querySelector('.post-box-body, .nl-post-body').textContent;
      navigator.clipboard.writeText(body);
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    };
  });
}

// ---------- Saved / Published list sections ----------

function renderListSection(status) {
  let list = saves.filter(s => s.status === status);
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c =>
      (c.data.content || '').toLowerCase().includes(q) ||
      (c.data.topic || '').toLowerCase().includes(q) ||
      (c.data.platform || '').toLowerCase().includes(q)
    );
  }

  const countLabel = `${list.length} ${status}`;
  if (!list.length) {
    return `
      <div class="results-bar"><span>${countLabel}</span></div>
      <div class="grid">
        <div class="empty">
          <h3>Nothing here yet</h3>
          <p>${status === 'saved' ? 'Generate a post from Forums or Newsletter and hit Save.' : 'Publish a saved post to see it here.'}</p>
        </div>
      </div>
    `;
  }

  return `
    <div class="results-bar"><span>${countLabel}</span></div>
    <div class="grid">${list.map(c => renderSavedCard(c)).join('')}</div>
  `;
}

function renderSavedCard(c) {
  const actions = c.status === 'saved'
    ? `<button class="action-btn publish-btn" data-publish="${c.id}">Publish</button><button class="action-btn trash-btn" data-trash="${c.id}">Trash</button>`
    : `<button class="action-btn save-btn" data-unpublish="${c.id}">Move to Saved</button><button class="action-btn trash-btn" data-trash="${c.id}">Trash</button>`;

  if (c.type === 'forum') {
    return `
      <div class="card">
        <div class="card-stripe ${stripeFor(c.data.platform)}"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="plat-pill">${escapeHtml(c.data.platform || '')}</span>
            <span style="font-size:11px;color:var(--muted);">${new Date(c.updated_at).toLocaleDateString()}</span>
          </div>
          <div class="post-box">
            <div class="post-box-head">
              <span class="post-box-label">${escapeHtml(c.data.topic || '')}</span>
              <button class="copy-btn" data-copy>Copy</button>
            </div>
            <div class="post-box-body">${escapeHtml(c.data.content)}</div>
          </div>
          <div class="card-actions">${actions}</div>
        </div>
      </div>
    `;
  }
  return `
    <div class="nl-card">
      <div class="nl-card-head">
        <div class="nl-meta">
          <div class="nl-topic">${escapeHtml(c.data.topic || '')}</div>
          <div class="nl-headline">${new Date(c.updated_at).toLocaleDateString()}</div>
        </div>
      </div>
      <div class="nl-body">
        <div class="nl-post-box">
          <div class="nl-post-head">
            <span class="nl-post-label">Issue</span>
            <button class="copy-btn" data-copy>Copy</button>
          </div>
          <div class="nl-post-body">${escapeHtml(c.data.content)}</div>
        </div>
        <div class="card-actions">${actions}</div>
      </div>
    </div>
  `;
}

function wireListSection() {
  wireCopyButtons();
  document.querySelectorAll('[data-publish]').forEach(btn => btn.onclick = () => updateCardStatus(btn.dataset.publish, 'published'));
  document.querySelectorAll('[data-unpublish]').forEach(btn => btn.onclick = () => updateCardStatus(btn.dataset.unpublish, 'saved'));
  document.querySelectorAll('[data-trash]').forEach(btn => btn.onclick = () => updateCardStatus(btn.dataset.trash, 'trashed'));
}

// ---------- Actions ----------

async function handleGenerate(type) {
  const singularType = type === 'forums' ? 'forum' : 'newsletter';
  generating = true;
  renderSection();
  try {
    const result = await authedFetch('generate', {
      method: 'POST',
      body: JSON.stringify({
        type: singularType,
        platform: singularType === 'forum' ? activePlatform : null,
        topic: activeTopic
      })
    });
    draft = result;
  } catch (err) {
    alert(err.message);
  } finally {
    generating = false;
    renderSection();
  }
}

async function persistDraft(status) {
  try {
    await authedFetch('saves', {
      method: 'POST',
      body: JSON.stringify({
        type: draft.type,
        status,
        data: { platform: draft.platform, topic: draft.topic, content: draft.content }
      })
    });
    draft = null;
    await loadSaves();
    renderHub();
  } catch (err) {
    alert(err.message);
  }
}

async function updateCardStatus(id, status) {
  const card = saves.find(s => s.id === id);
  if (!card) return;
  try {
    await authedFetch('saves', {
      method: 'POST',
      body: JSON.stringify({ id, type: card.type, status, data: card.data })
    });
    await loadSaves();
    renderHub();
  } catch (err) {
    alert(err.message);
  }
}

init();
</script>
</body>
</html>
